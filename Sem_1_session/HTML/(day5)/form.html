<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy</title>
</head>
<body>
    <form>
        <label for="name">Enter Your name</label>
        <input type="text" placeholder="Enter your name" id="name" name="name" required minlength="2" maxlength="30">
        <br>
        <hr>
        <br>
        <label for="age">Enter Your age</label>
        <input type="number" placeholder="age" id="age" name="age" required min="0" max="120">
        <br>
        <hr>
        <br>
        <label for="password">Enter Your password</label>
        <input type="password" placeholder="Enter your password" id="password" name="password" required minlength="8" maxlength="20">
        <br>
        <hr>
        <br>
        <label for="DOB">Enter Your Date of Birth</label>
        <input type="date" id="DOB" name="DOB" required>
        <br>
        <hr>
        <br>
        <label for="colour">Enter Your favourite colour</label>
        <input type="color" placeholder="Enter your favourite colour" id="colour" name="colour" required>
        <br>
        <hr>
        <br>
        <label for="email">Enter Your email</label>
        <input type="email" placeholder="Enter your email" id="email" name="email" required>
        <br>
        <hr>
        <br>
        <label for="checkbox">Do you accept the terms and conditions?</label>
        <input type="checkbox" id="checkbox" name="checkbox" required>
        <br>
        <hr>
        <br>
        <label for="radio">Accept Cookies?</label>
        <input type="radio" id="radio" name="radio" required>
        <br>
        <hr>
        <br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
    
</body>
</html>
